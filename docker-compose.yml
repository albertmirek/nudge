# Local backend stack: PostgreSQL + NestJS server (dev mode with hot reload).
# The Expo client runs natively on the host; see README.md.
#
#   pnpm docker:up     build & start everything
#   pnpm docker:db     start only PostgreSQL (run the server natively with pnpm server:dev)
#   pnpm docker:logs   follow logs
#   pnpm docker:down   stop everything (data volume is kept)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - nudge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      # Hot reload: only source is mounted, node_modules stay inside the image.
      - ./server/src:/app/server/src
    depends_on:
      db:
        condition: service_healthy

volumes:
  nudge_pgdata:
